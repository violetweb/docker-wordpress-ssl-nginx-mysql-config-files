server {
    listen 80;
    server_name wpssl.test www.wpssl.test;
    root /var/www/html; # Your website root directory

  
    index index.php index.html index.htm;

    ssl_certificate     /etc/nginx/certs/wpssl.test.pem;
    ssl_certificate_key /etc/nginx/certs/wpssl.test-key.pem;

     # WordPress permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP requests to WordPress (PHP-FPM)
        location ~ \.php$ {           
            fastcgi_pass   wordpress:9000;          # Upstream defined above
            fastcgi_index  index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            include        fastcgi_params;
        }


   

     # Block access to sensitive files
        location ~ /\.(ht|git|env) {
            deny all;
        }
    # Static asset caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
}

server {
    listen 443 ssl;
    server_name wpssl.test www.wpssl.test;

    ssl_certificate     /etc/nginx/certs/wpssl.test.pem;
    ssl_certificate_key /etc/nginx/certs/wpssl.test-key.pem;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass  wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include       fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
