version: '3.8'

services:
  nginx:
    container_name: my_nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress_data:/var/www/html        # Shared with WordPress
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - wordpress
    networks:
      - wpnet

  wordpress:
    container_name: wordpress
    image: wordpress:php8.2-fpm             # FPM variant (no built-in web server)
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: username
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - "./:/var/www/html"
    networks:
      - wpnet
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: username
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: secretpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wpnet    

volumes:
  wordpress_data:
  db_data:

networks:
  wpnet:
